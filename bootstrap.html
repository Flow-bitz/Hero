<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="p-5 bg-white rounded shadow-sm">
        <h1 class="text-primary">My First Bootstrap Page</h1>

        <p class="lead">
            Bootstrap helps me create attractive responsive websites faster.
        </p>

        <button class="btn btn-primary me-2">Get Started</button>
        <button class="btn btn-outline-secondary">Learn More</button>
        </div>
    </main>

    <div class="container p-2">
        <div class="row">
            <div class="col-md-6 bg-success">Column1</div>
            <div class="col-md-4 bg-primary">Column2</div>
            <div class="col-md-2 bg-dark text-light">Column3</div>
        </div>
    </div>

    <div class="container p-2">
        <div class="row">
            <div class="col-sm-6 bg-success">Column1</div>
            <div class="col-sm-4 bg-primary">Column2</div>
            <div class="col-sm-2 bg-dark text-light">Column3</div>
        </div>
    </div>

    <div class="container p-2">
        <div class="row">
            <div class="col-6 bg-success">Column1</div>
            <div class="col-4 bg-primary">Column2</div>
            <div class="col-2 bg-dark text-light">Column3</div>
        </div>
    </div>
<br><br>
<main>
    <h3 class="text-primary">Nested Column</h3>
    <div class="container p-2">
        <div class="row">
            <div class="col-md-8 bg-success">
            Main area

            <div class="row">
                <div class="col-6 bg-primary">Nested column 1</div>
                <div class="col-6 bg-danger">Nested column 2</div>
            </div>
            </div>

            <div class="col-md-4 bg-primary">
            Sidebar
            </div>
        </div>
    </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
